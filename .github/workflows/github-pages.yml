name: GitHub Pages

# Code changes: push to main and manual runs. GitHub Pages serves the gh-pages branch (Deploy from a branch);
# the data workflow ("Update Stocks data") and a local `bun run publish-local` push there too, so there is no
# workflow_run trigger (it would publish twice).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest default branch
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 2
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: bun install -E
      # api/stocks is not in git: take the feed the data workflow saved last, else the published one,
      # so a code deploy never replaces the site with one that has no data
      - name: Restore api/stocks from the Actions cache
        id: feed-cache
        uses: actions/cache/restore@v6
        with:
          path: api/stocks
          key: feed-stocks-pages-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: feed-stocks-
      # the site wins when it is newer than the cache (a local --publish) or the cache is empty
      - name: Download the published api/stocks when it is newer than the cache
        run: bun ./scripts/update-data.ts --restore-from https://daggerok.github.io/Stocks/api/stocks/ --if-newer
      - run: time bun run build-github-pages
      # refuses an index.json without companies, then force-pushes dist to gh-pages as one parentless commit
      - name: Publish the site to gh-pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun ./scripts/update-data.ts --publish --no-build
