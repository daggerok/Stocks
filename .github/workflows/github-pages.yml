name: GitHub Pages

# Code changes: push to main and manual runs. The data workflow ("Update Stocks data") deploys the
# site with the fresh feed itself, so there is no workflow_run trigger (it would deploy twice).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest default branch
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 2
      - uses: oven-sh/setup-bun@v2
      - run: bun install -E
      # api/stocks is not in git: take the feed the data workflow saved last, else the published one,
      # so a code deploy never replaces the site with one that has no data
      - name: Restore api/stocks from the Actions cache
        id: feed-cache
        uses: actions/cache/restore@v6
        with:
          path: api/stocks
          key: feed-stocks-pages-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: feed-stocks-
      - name: Download the published api/stocks when the cache is empty
        if: steps.feed-cache.outputs.cache-matched-key == ''
        run: bun ./scripts/update-data.ts --restore-from https://daggerok.github.io/Stocks/api/stocks/
      - run: time bun run build-github-pages
      - name: Refuse a deploy without data
        run: |
          bun --eval '
            const file = "dist/api/stocks/index.json";
            const rows = (await Bun.file(file).json().catch(() => ({})))?.companies;
            if (!Array.isArray(rows) || rows.length === 0) { console.error(file + " is missing or lists no companies: not deploying"); process.exit(1); }
            console.log(file + ": " + rows.length + " companies");
          '
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
