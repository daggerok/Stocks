name: Update Stocks data

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      max_fetches:
        description: "Batch size: 0 = all selected stocks, a positive value continues after the saved cursor; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      request_sleep:
        description: "Seconds between request starts of one worker lane; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      concurrency:
        description: "Parallel workers (each with its own request lane); blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      max_retries:
        description: "Retries after the initial request (integer >= 1); blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      exchanges:
        description: "Listing exchanges to include (Nasdaq,NYSE,CBOE); blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      tickers:
        description: "Ticker allowlist separated by spaces, commas or semicolons (blank in the config = every stock on the exchanges); blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      market_cap:
        description: "Market cap range in USD (min:max, K/M/B/T suffixes allowed); blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      dividend_yield:
        description: "Dividend yield percentage range (min:max); blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      history_range:
        description: "Yahoo history range (max, 10y, 5y, ...); blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      history_page_size:
        description: "Rows per generated history page; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      skip_yahoo:
        description: "true keeps the published market data and refreshes SEC fundamentals only; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      verbose:
        description: "true prints per-stock retry and fallback notices; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      performance_ytd:
        description: "Price change YTD range in percent (min:max); blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      performance_1y:
        description: "Price change 1Y range in percent (min:max); blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      performance_3y:
        description: "Price change 3Y range in percent (min:max); blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      performance_5y:
        description: "Price change 5Y range in percent (min:max); blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      performance_10y:
        description: "Price change 10Y range in percent (min:max); blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      total_return_ytd:
        description: "Total return YTD range in percent (min:max); blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      total_return_1y:
        description: "Total return 1Y range in percent (min:max); blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      total_return_3y:
        description: "Total return 3Y range in percent (min:max); blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      total_return_5y:
        description: "Total return 5Y range in percent (min:max); blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      total_return_10y:
        description: "Total return 10Y range in percent (min:max); blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      advanced:
        description: 'JSON object of supported control overrides not exposed above (keys are UPPER_CASE control names, values are scalars); nonblank individual inputs win'
        required: false
        default: '{}'
        type: string

permissions:
  contents: read

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run updater unit tests
        run: bun test
      - name: Resolve file defaults and manual overrides
        env:
          DISPATCH_INPUTS: ${{ toJSON(inputs) }}
          PROTECTED_SEC_UA: ${{ vars.SEC_UA }}
        run: |
          bun --eval '
            import { resolveControls } from "./scripts/update-data.ts";
            import { appendFile } from "node:fs/promises";
            // schedule runs have no dispatch inputs: file defaults apply as-is
            const inputs = JSON.parse(process.env.DISPATCH_INPUTS || "{}") || {};
            const advanced = JSON.parse(inputs.advanced || "{}");
            const individual = Object.fromEntries(Object.entries(inputs)
              .filter(([key]) => key !== "advanced")
              .map(([key, value]) => [key.toUpperCase(), value]));
            const file = await Bun.file("scripts/update-data.config.json").json();
            // Protected repository Actions variables: highest precedence, applied only when nonblank (never printed).
            const protectedVars = {};
            if ((process.env.PROTECTED_SEC_UA ?? "").trim()) protectedVars.SEC_UA = process.env.PROTECTED_SEC_UA.trim();
            const controls = resolveControls(file, advanced, individual, protectedVars);
            await appendFile(process.env.GITHUB_ENV,
              Object.entries(controls).map(([key, value]) => `${key}=${value}\n`).join(""));
          '
      # api/stocks is not in git: the updater needs the previous published state (never-shrinking index, rotation cursor)
      - name: Restore api/stocks from the Actions cache
        id: feed-cache
        uses: actions/cache/restore@v6
        with:
          path: api/stocks
          key: feed-stocks-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: feed-stocks-
      - name: Download the published api/stocks when the cache is empty
        if: steps.feed-cache.outputs.cache-matched-key == ''
        run: bun ./scripts/update-data.ts --restore-from https://daggerok.github.io/Stocks/api/stocks/
      - name: Generate api/stocks static data
        run: bun ./scripts/update-data.ts --signals
      - name: Save api/stocks to the Actions cache
        # also after a failed update: every company is either fully updated or kept as before
        if: ${{ !cancelled() && hashFiles('api/stocks/index.json') != '' }}
        uses: actions/cache/save@v6
        with:
          path: api/stocks
          key: feed-stocks-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Build the site with the feed
        run: bun run build-github-pages
      - name: Refuse a deploy without data
        run: |
          bun --eval '
            const file = "dist/api/stocks/index.json";
            const rows = (await Bun.file(file).json().catch(() => ({})))?.companies;
            if (!Array.isArray(rows) || rows.length === 0) { console.error(file + " is missing or lists no companies: not deploying"); process.exit(1); }
            console.log(file + ": " + rows.length + " companies");
          '
      # no actions/configure-pages here: it needs pages permissions this job does not have, and the artifact does not need it
      - name: Upload the site as a Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

  deploy:
    needs: update-data
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # one Pages deployment at a time, shared with github-pages.yml
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  signals-issue:
    # once a week (the scheduled run, after the deploy so the links show the new data): one issue with the signals of the
    # last 7 days, assigned to the owner so it arrives as a notification; nothing to report opens no issue
    if: github.event_name == 'schedule'
    needs: [update-data, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Restore api/stocks of this run from the Actions cache
        uses: actions/cache/restore@v6
        with:
          path: api/stocks
          key: feed-stocks-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true
      - name: Write the issue text
        id: issue
        run: bun ./scripts/update-data.ts --signals-issue "$RUNNER_TEMP/signals-issue" https://daggerok.github.io/Stocks/
      - name: Open the weekly signals issue
        if: steps.issue.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --repo "$GITHUB_REPOSITORY" --title "$(cat "$RUNNER_TEMP/signals-issue/title.txt")" --body-file "$RUNNER_TEMP/signals-issue/body.md" --assignee daggerok
